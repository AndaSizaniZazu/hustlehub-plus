name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - install, lint, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static analysis (ESLint + eslint-plugin-security)
        run: npm run lint

      - name: Unit and integration tests (Jest + supertest)
        run: npm test

      - name: Dependency audit (production deps, high and above fail the build)
        run: npm audit --omit=dev --audit-level=high

      - name: Build check (every source file parses)
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Save ESLint report
        if: always()
        run: mkdir -p ../evidence && npx eslint . -f json -o ../evidence/eslint-backend.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/coverage/lcov-report
            evidence/eslint-backend.json

  frontend:
    name: Frontend - install, lint, test, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static analysis (ESLint + eslint-plugin-security)
        run: npm run lint

      - name: Component tests (Vitest + React Testing Library)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit (high and above fail the build)
        run: npm audit --audit-level=high

      - name: Save ESLint report
        if: always()
        run: mkdir -p ../evidence && npx eslint . -f json -o ../evidence/eslint-frontend.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build
          path: |
            frontend/dist
            evidence/eslint-frontend.json

  codeql:
    name: Static analysis - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  docker:
    name: Docker - build images, run stack, API tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway JWT secret for this run
        run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"

      - name: Build images
        run: docker compose build

      - name: Start the stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 180

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Newman
        working-directory: backend
        run: npm ci

      - name: API tests against the containers (Postman collection via Newman)
        working-directory: backend
        run: >
          npx newman run ../postman/HustleHub.postman_collection.json
          --env-var baseUrl=http://localhost:8080/api
          -r cli,htmlextra --reporter-htmlextra-export ../postman/reports/newman-report.html

      - name: Collect container logs (logging evidence)
        if: always()
        run: |
          mkdir -p evidence/logs
          docker compose ps > evidence/logs/compose-ps.txt
          docker compose logs --no-color > evidence/logs/compose.log
          docker compose cp backend:/app/logs/. evidence/logs/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: |
            evidence/logs
            postman/reports

      - name: Stop the stack
        if: always()
        run: docker compose down -v
