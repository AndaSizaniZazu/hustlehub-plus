server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 16k;

  # API calls stay same-origin for the browser; nginx forwards them to the HTTPS API
  location /api/ {
    proxy_pass https://backend:5000;
    proxy_ssl_verify off; # backend uses a self-signed certificate inside the private network
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr; # overwrite, so clients cannot spoof their IP
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React Router: unknown paths load the app.
  # Headers live here, not on the server block, so /api keeps the API's own Helmet headers.
  location / {
    # same CSP as `vite preview` (vite.config.js); 'unsafe-inline' styles are needed by recharts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri $uri/ /index.html;
  }
}
